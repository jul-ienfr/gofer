name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  test:
    strategy:
      fail-fast: false
      matrix:
        # The arm64 macOS pool is repeatedly drained; use the Intel image.
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test core packages
        shell: bash
        run: |
          go test -count=1 -timeout 30m \
            ./internal/storage \
            ./internal/backup \
            ./internal/a11y \
            ./internal/handler \
            ./internal/server \
            ./internal/views \
            ./internal/i18n \
            ./internal/jev \
            ./internal/aipipeline \
            ./internal/airouting \
            ./internal/unsubscribe \
            ./internal/drafting \
            ./internal/policy \
            ./internal/legitimacy \
            ./internal/projects \
            ./internal/routing \
            ./internal/llm \
            ./internal/aiworker \
            ./internal/aisettings \
            ./internal/aiaudit \
            ./internal/aievents
      - name: Test client i18n formatting
        run: node scripts/test-i18n-dates.cjs
      - name: Build
        run: go build ./...

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: false
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
